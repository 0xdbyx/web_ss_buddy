<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>web_ss_buddy · Screenshot report</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131313; --surface: #1c1c1c; --raised: #272727; --field: #181818;
  --text: #efefee; --muted: #b6b6b1; --line: #414141; --control: #70706c;
  --accent: #e4c89b; --selected: #e8e6df; --selected-text: #20201e;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f3f0; --surface: #fff; --raised: #f0efeb; --field: #fff;
  --text: #242422; --muted: #565650; --line: #d8d7d1; --control: #83837a;
  --accent: #725022; --selected: #33332f; --selected-text: #fff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
h1, h2, p, dl { margin: 0; }
h1 { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 15px; font-weight: 650; }
header { background: var(--surface); border-bottom: 1px solid var(--line); }
.shell { width: min(100%, 1530px); margin-inline: auto; padding-inline: clamp(12px, 3vw, 28px); }
.header, .toolbar, .panel-header, .navigation, .views { display: flex; align-items: center; gap: 10px; }
.header { justify-content: space-between; min-height: 65px; padding-block: 10px; }
.subtitle, .quiet { color: var(--muted); font-size: 13px; }
main { padding-block: 22px 40px; }
.toolbar { justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
button, input, select { font: inherit; color: inherit; border: 1px solid var(--control); border-radius: 5px; min-height: 38px; }
button { background: var(--raised); padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"] { background: var(--selected); color: var(--selected-text); border-color: var(--selected); font-weight: 650; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.views { background: var(--surface); padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 6px; }
.views button { min-height: 34px; border-color: transparent; }
.views button[aria-pressed="false"] { background: transparent; }
#search { width: min(100%, 470px); flex: 1 1 265px; background: var(--field); padding: 7px 11px; }
#search::placeholder { color: var(--muted); opacity: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.panel-header { padding: 12px 15px; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#targets { background: var(--field); padding: 6px; inline-size: min(100%, 470px); }
.navigation { flex-wrap: wrap; }
.preview-body { display: grid; grid-template-columns: minmax(245px, 29%) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
.metadata { display: grid; grid-template-columns: minmax(99px, 37%) minmax(0, 1fr); border: 1px solid var(--line); border-bottom: 0; }
.metadata dt, .metadata dd { padding: 9px; margin: 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.metadata dt { color: var(--muted); font-size: 12px; background: var(--raised); }
.metadata dd { font-size: 13px; white-space: pre-wrap; }
.image-button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); overflow: hidden; cursor: zoom-in; }
.image-button img { display: block; width: 100%; height: auto; background: #fff; }
#capture-details { border-top: 1px solid var(--line); padding: 10px 16px; overflow-wrap: anywhere; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px; padding: 14px; }
.tile { display: flex; flex-direction: column; gap: 8px; justify-content: space-between; text-align: left; min-width: 0; overflow-wrap: anywhere; padding: 8px; }
.tile img { display: block; background: var(--bg); width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
.table-scroll { max-height: min(65vh, 640px); overflow: auto; }
table { width: 100%; min-width: 790px; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { text-align: left; padding: 9px 11px; vertical-align: top; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--raised); white-space: nowrap; z-index: 1; }
.cell-text { display: block; max-width: 38ch; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
td button { min-height: 30px; padding: 3px 7px; text-align: left; max-width: 23ch; }
.empty { padding: 22px 12px; text-align: center; color: var(--muted); }
dialog { max-width: 98vw; max-height: 96vh; padding: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--control); border-radius: 6px; }
dialog::backdrop { background: rgb(0 0 0 / .88); }
.dialog-actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
dialog img { display: block; max-width: calc(98vw - 28px); max-height: 82vh; width: auto; height: auto; }
#feedback { font-size: 13px; color: var(--muted); }
.copy-buffer { position: fixed; left: -10000px; top: 0; }
@media (max-width: 920px) {
  .preview-body { grid-template-columns: minmax(0, 1fr); }
  .preview-image { grid-row: 1; }
}
@media (max-width: 600px) {
  .views { width: 100%; }
  .views button { flex: 1; }
  .preview-body { padding: 10px; }
}
</style>
</head>
<body>
<header>
  <div class="shell header">
    <div><h1>web_ss_buddy</h1><span class="subtitle">Screenshot report</span></div>
    <button id="theme" type="button">Light mode</button>
  </div>
</header>
<main class="shell">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search targets, URLs, titles or status…" aria-label="Search results">
    <div class="views" role="group" aria-label="Report view">
      <button type="button" data-view="preview" aria-pressed="true">Preview</button>
      <button type="button" data-view="gallery" aria-pressed="false">Gallery</button>
      <button type="button" data-view="table" aria-pressed="false">Table</button>
    </div>
  </div>
  <noscript><p class="empty">Enable JavaScript to open this offline report.</p></noscript>
  <section class="panel" id="report" aria-label="Screenshot results" hidden>
    <div class="panel-header">
      <select id="targets" aria-label="Select a target"></select>
      <h2 id="view-title" hidden></h2>
      <div class="navigation">
        <span class="quiet" id="count" role="status"></span>
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
      </div>
    </div>
    <p id="empty" class="empty" hidden>No matching targets.</p>
    <div id="preview">
      <div class="preview-body">
        <dl id="metadata" class="metadata"></dl>
        <div class="preview-image">
          <button id="zoom" class="image-button" type="button" aria-label="Enlarge screenshot"><img id="screenshot" alt=""></button>
          <p id="missing" class="empty" hidden>Screenshot unavailable.</p>
        </div>
      </div>
      <p id="capture-details" class="quiet" hidden></p>
    </div>
    <div id="gallery" class="gallery" hidden></div>
    <div id="table" hidden>
      <div class="panel-header">
        <span id="feedback" role="status"></span>
        <button id="copy-table" type="button">Copy table</button>
      </div>
      <div class="table-scroll" tabindex="0" aria-label="Scrollable results table">
        <table aria-label="Results"><thead id="head"></thead><tbody id="rows"></tbody></table>
      </div>
    </div>
  </section>
</main>
<dialog id="zoom-dialog" aria-label="Enlarged screenshot">
  <div class="dialog-actions"><button type="button" id="close-zoom" autofocus>Close</button></div>
  <img id="enlarged" alt="">
</dialog>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
const byId = id => document.getElementById(id);
const {headers, records} = JSON.parse(byId('report-data').textContent);
const searchText = records.map(record =>
  record.metadata.map(([, value]) => value).concat(record.columns, record.error).join(' ').toLowerCase()
);
const pageSize = {preview: 1, gallery: 24, table: 100};
const viewLabels = {gallery: 'Screenshot gallery', table: 'Results table'};
const viewButtons = document.querySelectorAll('[data-view]');
const picker = byId('targets');
const shot = byId('screenshot');
const zoom = byId('zoom');
const missing = byId('missing');
const dialog = byId('zoom-dialog');
let matching = [];
let position = 0;
let view = 'preview';
let searchTimer;

function element(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

function selectPreview(index) {
  position = index;
  setView('preview');
  picker.focus();
}

function showPreview(record, start) {
  // Bound the option count even for very large reports. Prev/Next cross these groups.
  const first = Math.floor(start / 100) * 100;
  const options = matching.slice(first, first + 100).map((index, offset) => {
    const target = records[index];
    const option = element('option', `${first + offset + 1}. ${target.columns[2]}`);
    option.value = first + offset;
    return option;
  });
  picker.replaceChildren(...options);
  picker.value = start;
  byId('metadata').replaceChildren(...record.metadata.flatMap(([label, value]) =>
    [element('dt', label), element('dd', value === '' || value === null ? '—' : value)]
  ));
  zoom.hidden = !record.image;
  missing.hidden = Boolean(record.image);
  if (record.image) {
    shot.alt = `Browser window for ${record.columns[2]}`;
    shot.src = record.image;
  } else {
    shot.removeAttribute('src');
  }
  const details = byId('capture-details');
  details.textContent = record.error;
  details.hidden = !record.error;
}

function showGallery(indices, start) {
  byId('gallery').replaceChildren(...indices.map((index, offset) => {
    const record = records[index];
    const tile = element('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.addEventListener('click', () => selectPreview(start + offset));
    const description = element('span', record.columns[2]);
    const unavailable = element('span', 'Screenshot unavailable');
    unavailable.className = 'quiet';
    if (record.image) {
      const img = element('img');
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', () => img.replaceWith(unavailable), {once: true});
      img.src = record.image;
      tile.append(img);
    } else {
      tile.append(unavailable);
    }
    tile.append(description);
    return tile;
  }));
}

function showTable(indices, start) {
  byId('feedback').textContent = `Copy ${matching.length} matching ${matching.length === 1 ? 'row' : 'rows'} as TSV`;
  byId('rows').replaceChildren(...indices.map((index, offset) => {
    const row = element('tr');
    records[index].columns.forEach((value, column) => {
      const cell = element('td');
      const text = element(column === 0 ? 'button' : 'span', value ?? '');
      text.className = 'cell-text';
      text.title = value ?? '';
      if (column === 0) {
        text.type = 'button';
        text.setAttribute('aria-label', `Preview ${records[index].columns[2]}`);
        text.addEventListener('click', () => selectPreview(start + offset));
      }
      cell.append(text);
      row.append(cell);
    });
    return row;
  }));
}

function render() {
  const size = pageSize[view];
  const total = matching.length;
  const start = Math.floor(position / size) * size;
  const end = Math.min(start + size, total);
  const isPreview = view === 'preview';
  picker.hidden = !isPreview || !total;
  const title = byId('view-title');
  title.hidden = isPreview;
  title.textContent = viewLabels[view] || '';
  byId('count').textContent = total ? `${start + 1}${end > start + 1 ? '–' + end : ''} of ${total}` : '0 results';
  byId('previous').disabled = start === 0;
  byId('next').disabled = end >= total;
  byId('empty').hidden = Boolean(total);
  for (const name of Object.keys(pageSize)) byId(name).hidden = name !== view || !total;
  if (!total) return;

  if (isPreview) showPreview(records[matching[start]], start);
  else if (view === 'gallery') showGallery(matching.slice(start, end), start);
  else showTable(matching.slice(start, end), start);
}

function setView(name) {
  view = name;
  for (const button of viewButtons) button.setAttribute('aria-pressed', button.dataset.view === view);
  render();
}

function filter() {
  const term = byId('search').value.trim().toLowerCase();
  matching = [];
  searchText.forEach((text, index) => { if (text.includes(term)) matching.push(index); });
  position = 0;
  render();
}

async function copyTable() {
  const clean = value => value.replace(/[\t\r\n]+/g, ' ');
  const rows = matching.map(index => records[index].cells.map(clean).join('\t'));
  const tsv = [headers.join('\t'), ...rows].join('\n');
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(tsv);
      copied = true;
    }
  } catch {}
  if (!copied) {
    const buffer = element('textarea');
    buffer.value = tsv;
    buffer.className = 'copy-buffer';
    document.body.append(buffer);
    buffer.select();
    try { copied = document.execCommand('copy'); } catch {}
    buffer.remove();
    byId('copy-table').focus();
  }
  byId('feedback').textContent = copied ? 'Copied matching rows' : 'Clipboard unavailable. Select text in the table to copy.';
}

function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  byId('theme').textContent = mode === 'dark' ? 'Light mode' : 'Dark mode';
  try { sessionStorage.setItem('web-ss-buddy-theme', mode); } catch {}
}

byId('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
for (const button of viewButtons) button.addEventListener('click', () => setView(button.dataset.view));
byId('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(filter, 120);
});
picker.addEventListener('change', () => { position = Number(picker.value); render(); });
byId('previous').addEventListener('click', () => {
  position = Math.max(0, (Math.floor(position / pageSize[view]) - 1) * pageSize[view]);
  render();
});
byId('next').addEventListener('click', () => {
  position = (Math.floor(position / pageSize[view]) + 1) * pageSize[view];
  render();
});
shot.addEventListener('error', () => {
  zoom.hidden = true;
  missing.hidden = false;
});
zoom.addEventListener('click', () => {
  byId('enlarged').src = shot.src;
  byId('enlarged').alt = shot.alt;
  dialog.showModal();
});
byId('close-zoom').addEventListener('click', () => dialog.close());
byId('copy-table').addEventListener('click', copyTable);
const headerRow = element('tr');
headers.forEach(label => {
  const cell = element('th', label);
  cell.scope = 'col';
  headerRow.append(cell);
});
byId('head').append(headerRow);
try { if (sessionStorage.getItem('web-ss-buddy-theme') === 'light') setTheme('light'); } catch {}
byId('report').hidden = false;
filter();
</script>
</body>
</html>
